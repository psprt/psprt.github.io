<!doctype html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, user-scalable=0"/>
  <title>firebird-emu</title>
  <style>
    html, body { padding: 0; margin: 0; overflow: hidden; height: 100vh; }
    canvas { border: 0px none; background-color: white; height: 100%; width: 100%; outline: 0px solid transparent; caret-color: transparent; cursor: default; }
    
    #rom-modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); display: flex; align-items: center; justify-content: center; z-index: 9999; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .rom-modal { background: #fff; color: #333; padding: 30px; border-radius: 12px; max-width: 420px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.3); position: relative; }
    .rom-modal h2 { margin-top: 0; color: #2c3e50; }
    .rom-modal p { line-height: 1.6; font-size: 15px; margin-bottom: 10px; text-align: left; color: #555; }
    
    /* 列表悬挂缩进样式 */
    .step-list { padding-left: 24px; margin-top: 0; margin-bottom: 25px; text-align: left; color: #555; font-size: 15px; line-height: 1.6; }
    .step-list li { margin-bottom: 8px; padding-left: 4px; }
    .step-list li::marker { font-weight: bold; color: #333; }
    
    .close-btn { position: absolute; top: 15px; right: 20px; cursor: pointer; font-size: 24px; font-weight: bold; color: #999; transition: 0.2s; }
    .close-btn:hover { color: #333; }
    .dl-btn { display: inline-block; background: #3498db; color: #fff; padding: 12px 24px; text-decoration: none; border-radius: 6px; font-weight: bold; font-size: 16px; transition: background 0.2s; width: 80%; box-sizing: border-box; }
    .dl-btn:hover { background: #2980b9; }
    .skip-text { margin-top: 15px; font-size: 13px; color: #7f8c8d; cursor: pointer; text-decoration: underline; }
    .skip-text:hover { color: #34495e; }
  </style>
</head>
<body onload="init()">
  
  <div id="rom-modal-overlay">
    <div class="rom-modal">
      <span class="close-btn" onclick="closeModal()">×</span>
      <h2>固件下载提示</h2>
      
      <p>首次运行模拟器需要手动加载固件：</p>
      <ol class="step-list">
        <li>点击下方按钮下载固件压缩包。</li>
        <li>在本地电脑解压该压缩包。</li>
        <li>在本页底部，载入解压后的 <code>Boot1.img</code> 与 <code>Flash.bin</code>。</li>
        <li>左滑本页面，进入模拟器并启动。</li>
      </ol>

      <a href="roms.zip" class="dl-btn" download="roms.zip" onclick="closeModal()">⬇️ 下载 roms.zip</a>
      <div class="skip-text" onclick="closeModal()">我已下载，直接进入模拟器</div>
    </div>
  </div>

  <figure style="overflow:visible;" id="qtspinner">
    <center style="margin-top:1.5em; line-height:150%">
      <img src="qtlogo.svg" width="320" height="200" style="display:block"></img>
      <strong>Qt for WebAssembly: firebird-emu</strong>
      <div id="qtstatus"></div>
      <noscript>JavaScript is disabled. Please enable JavaScript to use this application.</noscript>
    </center>
  </figure>
  <canvas id="qtcanvas" oncontextmenu="event.preventDefault()" contenteditable="true"></canvas>

  <script type='text/javascript'>
    function closeModal() {
      document.getElementById('rom-modal-overlay').style.display = 'none';
    }

    function init() {
      var spinner = document.querySelector('#qtspinner');
      var canvas = document.querySelector('#qtcanvas');
      var status = document.querySelector('#qtstatus');

      var qtLoader = QtLoader({
        canvasElements : [canvas],
        showLoader: function(loaderStatus) {
          spinner.style.display = 'block';
          canvas.style.display = 'none';
          status.innerHTML = loaderStatus + "...";
        },
        showError: function(errorText) {
          status.innerHTML = errorText;
          spinner.style.display = 'block';
          canvas.style.display = 'none';
        },
        showExit: function() {
          status.innerHTML = "Application exit";
          if (qtLoader.exitCode !== undefined) status.innerHTML += " with code " + qtLoader.exitCode;
          if (qtLoader.exitText !== undefined) status.innerHTML += " (" + qtLoader.exitText + ")";
          spinner.style.display = 'block';
          canvas.style.display = 'none';
        },
        showCanvas: function() {
          spinner.style.display = 'none';
          canvas.style.display = 'block';
        },
      });
      qtLoader.loadEmscriptenModule("firebird-emu");
    }
  </script>
  <script type="text/javascript" src="qtloader.js"></script>
</body>
</html>
